name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          PUBLIC_FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}
          URL: ${{ vars.SITE_URL }}

      - name: oidc claims
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import json,sys;print(json.load(sys.stdin)['value'])")
          python3 - "$token" <<'PY'
          import base64, json, sys
          payload = sys.argv[1].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for name in ("iss", "aud", "sub", "repository", "repository_owner"):
              print(name, "=", claims.get(name))
          PY

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: upload
        run: |
          aws s3 sync dist/_astro/ "s3://${{ vars.BUCKET }}/_astro/" \
            --no-progress --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist/ "s3://${{ vars.BUCKET }}/" --no-progress \
            --exclude "_astro/*" --exclude "*.html" --exclude "*.xml" \
            --exclude "*.txt" --exclude "*.webmanifest" \
            --cache-control "public, max-age=86400"
          aws s3 sync dist/ "s3://${{ vars.BUCKET }}/" --no-progress \
            --exclude "*" --include "*.html" --include "*.xml" \
            --include "*.txt" --include "*.webmanifest" \
            --cache-control "no-cache, must-revalidate"
          aws s3 sync dist/ "s3://${{ vars.BUCKET }}/" --no-progress --size-only --delete

      - name: invalidate
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.DISTRIBUTION }}" --paths '/*'
